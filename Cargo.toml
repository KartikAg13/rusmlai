[package]
name = "rusmlai"
version = "0.2.0"
edition = "2024"

[dependencies]
comfy-table = { version = "7.2.2", default-features = false }
polars = { version = "0.54.4", default-features = false, features = ["lazy", "strings", "temporal", "fmt_no_tty"] }
serde = { version = "1.0.228", default-features = false}
serde_json = { version = "1.0.150", default-features = false, features = ["std"] }
thiserror = { version = "2.0.18", default-features = false }
thiserror-context = { version = "0.1.2", default-features = false }
