[package]
name = "rusmlai"
version = "0.9.0"
edition = "2024"

[dependencies.comfy-table]
version = "8.0"
default-features = false

# Matrix products and solves for the models: its Gram matrix beat OpenBLAS on one thread
# (docs/performance.md, Part 2). Only `std`: no rayon, rand or sparse solvers.
[dependencies.faer]
version = "0.24.4"
default-features = false
features = ["std"]

# Polars' own thread pool (`runtime::THREAD_POOL`), so model code and Polars share the cores
# instead of two pools competing for them. Both are already compiled as part of Polars.
[dependencies.polars-core]
version = "0.55.2"
default-features = false

[dependencies.rayon]
version = "1.12.0"

# erfc for the normal quantile of `RobustScaler::unit_variance`; already built for faer.
[dependencies.libm]
version = "0.2.16"

[dependencies.indexmap]
version = "2.14.0"
default-features = false
features = ['serde']

[dependencies.polars]
version = "0.55.2"
default-features = false
features = ["csv", "fmt_no_tty", "lazy", "replace", "serde"]

# SVG to pixels, for the PNG a chart saves (`display::png`).
[dependencies.resvg]
version = "0.48.1"
default-features = false
features = ["memmap-fonts", "system-fonts", "text"]

# Pixels to a .png file. resvg can encode PNGs only at its slow compression level.
[dependencies.png]
version = "0.18.1"
default-features = false

[dependencies.serde]
version = "1.0.228"
default-features = false
features = ["derive", "std"]

[dependencies.serde_json]
version = "1.0.150"
default-features = false
features = ["std"]

[dependencies.thiserror]
version = "2.0.18"
default-features = false

[dependencies.unicode-width]
version = "0.2.2"

[dev-dependencies.criterion]
version = "0.8.2"
default-features = false
features = ["cargo_bench_support", "html_reports", "plotters"]

[dev-dependencies.proptest]
version = "1.7"
default-features = false
features = ["std"]

[profile.dev.package."*"]
debug = false

[lib]
bench = false

[profile.dev]
split-debuginfo = "unpacked"
# PNG charts: unoptimized, drawing and encoding take most of a second per chart. Only crates
# outside Polars' tree, so this never rebuilds Polars.
package.fdeflate.opt-level = 3
package.fontdb.opt-level = 3
package.harfrust.opt-level = 3
package.kurbo.opt-level = 3
package.png.opt-level = 3
package.read-fonts.opt-level = 3
package.resvg.opt-level = 3
package.roxmltree.opt-level = 3
package.skrifa.opt-level = 3
package.svgtypes.opt-level = 3
package.tiny-skia.opt-level = 3
package.tiny-skia-path.opt-level = 3
package.usvg.opt-level = 3

[profile.bench]
debug = "line-tables-only"

[[bench]]
name = "dataset"
harness = false

[[bench]]
name = "metadata"
harness = false

[[bench]]
name = "cache"
harness = false

[[bench]]
name = "plot"
harness = false

[[bench]]
name = "preprocess"
harness = false

[[bench]]
name = "models"
harness = false
